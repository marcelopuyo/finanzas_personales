# Build de sherpa-onnx para WebAssembly — experimento de voz OFFLINE (pantalla /voz-lab).
#
# POR QUÉ ESTE WORKFLOW EXISTE (y no se compila en la PC de desarrollo):
#   el build local usa Docker (imagen emscripten/emsdk) y eso BLOQUEA la PC con
#   pantalla azul (BSOD 0x3B SYSTEM_SERVICE_EXCEPTION) al levantar la VM de Docker Desktop.
#   Ocurrió 2 veces con la misma firma: 31/08/2026 20:29 y 21/09/2026 23:59.
#   Detalle: DeepSeek/plan-voz-offline-sherpa.md.
#
# Acá el build corre en un runner de GitHub con emsdk NATIVO (sin Docker ni virtualización local).
# Sigue el procedimiento oficial del proyecto (ver .github/workflows/wasm-simd-hf-space-vad-asr.yaml
# en k2-fsa/sherpa-onnx): emsdk 4.0.23 + build-wasm-simd-vad-asr.sh, que compila la app VAD + ASR
# NO streaming (la que sabe usar Whisper offline).
#
# CÓMO SE USA:  pestaña Actions -> "Build sherpa-onnx WASM (voz offline)" -> Run workflow.
# RESULTADO:    2 artifacts —
#   · sherpa-wasm-web-*        -> los archivos de la app (js/wasm/.data chicos) para el repo
#   · sherpa-modelo-supabase-* -> encoder + decoder TROCEADO en partes de 45 MB, con hashes
#
# Por qué troceado: el plan Free de Supabase Storage tiene un tope global de 50 MB POR ARCHIVO
# (supabase.com/docs/guides/storage/uploads/file-limits) y el decoder de whisper-tiny int8 pesa
# 85,7 MB, así que se parte en 2 objetos que el cliente vuelve a unir antes de escribirlos en el
# FS de WASM. Por lo mismo, el modelo NO se empaqueta en el .data (serían ~101 MB en un archivo).

name: Build sherpa-onnx WASM (voz offline)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modelo Whisper multilingüe (int8)"
        type: choice
        default: tiny
        options:
          - tiny
          - base
          - small
      sherpa_tag:
        description: "Tag de k2-fsa/sherpa-onnx a compilar (pineado)"
        type: string
        default: v1.13.8

permissions:
  contents: read

concurrency:
  group: sherpa-wasm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: emsdk 4.0.23 · whisper-${{ inputs.model }} · ${{ inputs.sherpa_tag }}
    runs-on: ubuntu-latest
    # El script oficial usa `make -j2`, así que la compilación es lenta (30-90 min).
    timeout-minutes: 180
    env:
      MODEL: ${{ inputs.model }}
      SHERPA_TAG: ${{ inputs.sherpa_tag }}
    steps:
      - name: Instalar emsdk 4.0.23 (sin Docker)
        run: |
          set -eux
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          cd emsdk
          ./emsdk install 4.0.23
          ./emsdk activate 4.0.23
          # El script de build espera $EMSCRIPTEN apuntando al toolchain
          echo "EMSCRIPTEN=$GITHUB_WORKSPACE/emsdk/upstream/emscripten" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/emsdk" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      - name: Verificar emcc
        run: |
          set -eux
          emcc --version
          test -f "$EMSCRIPTEN/cmake/Modules/Platform/Emscripten.cmake"

      - name: Clonar sherpa-onnx (tag pineado)
        run: |
          set -eux
          git clone --depth 1 --branch "$SHERPA_TAG" \
            --recurse-submodules --shallow-submodules \
            https://github.com/k2-fsa/sherpa-onnx.git sherpa-onnx
          cd sherpa-onnx
          echo "SHERPA_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git log -1 --format='%H %s'

      # B3a: el .data es UN archivo y tiene el tope de 50 MB, así que el modelo NO se empaqueta
      # ahí. En assets/ van solo los dos archivos chicos que exige el CMakeLists del target
      # (silero_vad.onnx ~2 MB + tokens.txt ~0,8 MB) ⇒ .data de ~3 MB.
      - name: Assets que se empaquetan en el .data (solo los chicos)
        run: |
          set -eux
          cd sherpa-onnx/wasm/vad-asr/assets
          rm -rf ./*
          base=https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models
          curl -SsfL -O "$base/silero_vad.onnx"
          curl -SsfL -O "$base/sherpa-onnx-whisper-$MODEL.tar.bz2"
          tar xf "sherpa-onnx-whisper-$MODEL.tar.bz2"
          mv -v "sherpa-onnx-whisper-$MODEL"/*-tokens.txt tokens.txt
          rm -rf "sherpa-onnx-whisper-$MODEL" ./*.tar.bz2
          ls -lh

      # El modelo va a Supabase Storage: cada objeto tiene que pesar < 50 MB ⇒ el decoder se
      # trocea en partes de 45 MB y el cliente las vuelve a unir. El encoder (12,3 MB) entra entero.
      - name: Modelo para Supabase Storage (encoder entero + decoder troceado)
        run: |
          set -eux
          mkdir -p modelo
          cd modelo
          base=https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models
          curl -SsfL -O "$base/sherpa-onnx-whisper-$MODEL.tar.bz2"
          tar xf "sherpa-onnx-whisper-$MODEL.tar.bz2"
          dir="sherpa-onnx-whisper-$MODEL"
          enc="$(ls "$dir"/*-encoder.int8.onnx 2>/dev/null | head -n1 || true)"
          [ -n "$enc" ] || enc="$(ls "$dir"/*-encoder.onnx | head -n1)"
          dec="$(ls "$dir"/*-decoder.int8.onnx 2>/dev/null | head -n1 || true)"
          [ -n "$dec" ] || dec="$(ls "$dir"/*-decoder.onnx | head -n1)"
          mv -v "$enc" whisper-encoder.onnx
          DEC_BYTES=$(stat -c%s "$dec")
          DEC_SHA=$(sha256sum "$dec" | cut -d' ' -f1)
          CHUNK=$((45 * 1024 * 1024))
          split -b "$CHUNK" -d -a 2 "$dec" whisper-decoder.part
          rm -rf "$dir" ./*.tar.bz2
          ls -lh
          {
            echo "modelo            : whisper-$MODEL int8 (multilingüe)"
            echo "sherpa-onnx       : $SHERPA_TAG ($SHERPA_COMMIT)"
            echo "troceo            : $CHUNK bytes por objeto (tope Supabase Free: 50 MB/archivo)"
            echo "decoder completo  : $DEC_BYTES bytes  sha256=$DEC_SHA"
            echo
            echo "== objetos para el bucket público =="
            for f in whisper-encoder.onnx whisper-decoder.part*; do
              printf '%-26s %10s bytes  %s\n' "$f" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
          } > MANIFEST.txt
          cat MANIFEST.txt
          sha256sum whisper-encoder.onnx whisper-decoder.part* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Compilar (build-wasm-simd-vad-asr.sh, sin modificar)
        working-directory: sherpa-onnx
        run: ./build-wasm-simd-vad-asr.sh

      - name: Empaquetar la entrega (web -> repo · modelo -> Supabase)
        run: |
          set -eux
          src=sherpa-onnx/build-wasm-simd-vad-asr/install/bin/wasm/vad-asr
          ls -lh "$src"
          rm -rf entrega
          mkdir -p entrega/web entrega/modelo
          cp -a "$src"/. entrega/web/
          mv modelo/* entrega/modelo/
          rmdir modelo
          tar cjf entrega/web.tar.bz2 -C entrega web
          {
            echo "sherpa-onnx tag : $SHERPA_TAG"
            echo "sherpa-onnx sha : $SHERPA_COMMIT"
            echo "emsdk           : 4.0.23"
            echo "script          : build-wasm-simd-vad-asr.sh (sin modificar)"
            echo "modelo          : whisper-$MODEL int8 — NO va en el .data (tope de 50 MB/archivo)"
            echo "fecha (UTC)     : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run             : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "== web/ (va al repo: public/voz-lab/sherpa/) =="
            find entrega/web -type f -printf '%12s  %p\n' | sort -k2
            echo
            echo "== modelo/ (va a Supabase Storage, bucket público) =="
            cat entrega/modelo/MANIFEST.txt
          } > entrega/BUILD-INFO.txt
          cat entrega/BUILD-INFO.txt
          find entrega -type f -exec sha256sum {} + > entrega/SHA256SUMS.txt
          cat entrega/SHA256SUMS.txt
          du -sh entrega entrega/*

      - name: Publicar artefacto web (va al repo)
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-wasm-web-whisper-${{ inputs.model }}-${{ inputs.sherpa_tag }}
          path: entrega/web/**
          if-no-files-found: error
          retention-days: 30

      - name: Publicar artefacto modelo (va a Supabase Storage)
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-modelo-supabase-whisper-${{ inputs.model }}-${{ inputs.sherpa_tag }}
          path: |
            entrega/modelo/**
            entrega/BUILD-INFO.txt
            entrega/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Resumen
        run: |
          {
            echo "## Build WASM listo"
            echo
            echo "| dato | valor |"
            echo "|---|---|"
            echo "| sherpa-onnx | \`$SHERPA_TAG\` (\`$SHERPA_COMMIT\`) |"
            echo "| modelo | \`whisper-$MODEL\` int8 + \`silero_vad\` |"
            echo "| emsdk | 4.0.23 |"
            echo "| modelo | \`whisper-$MODEL\` int8 + \`silero_vad\` (troceado en Supabase Storage) |"
            echo
            echo "Dos artifacts: \`sherpa-wasm-web-*\` (al repo) y \`sherpa-modelo-supabase-*\`."
            echo "Verificá con \`sha256sum -c SHA256SUMS.txt\`."
          } >> "$GITHUB_STEP_SUMMARY"
